<!doctype html>
<html lang="tr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="noindex" />
    <title>GençTek Görünmeyen Yüz</title>
    <style>
      :root {
        color-scheme: dark;
        --red: #d1122a;
        --red-hot: #ff334c;
        --red-soft: rgba(209, 18, 42, 0.42);
        --ink: #05070c;
        --white: #fff7f7;
        --muted: rgba(255, 247, 247, 0.74);
      }

      * {
        box-sizing: border-box;
      }

      html,
      body {
        margin: 0;
        min-height: 100%;
        overflow-x: hidden;
      }

      body {
        align-items: center;
        background:
          radial-gradient(circle at 18% 28%, rgba(255, 35, 64, 0.28), transparent 25%),
          radial-gradient(circle at 82% 18%, rgba(255, 35, 64, 0.18), transparent 28%),
          radial-gradient(circle at 52% 66%, rgba(255, 255, 255, 0.08), transparent 24%),
          linear-gradient(135deg, #060910 0%, #09070c 42%, #22030b 100%);
        color: var(--white);
        display: grid;
        font-family:
          Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont,
          "Segoe UI", sans-serif;
        min-height: 100vh;
        padding: clamp(16px, 4vw, 44px);
        position: relative;
      }

      body::before,
      body::after {
        content: "";
        inset: 0;
        pointer-events: none;
        position: fixed;
      }

      body::before {
        background:
          linear-gradient(90deg, rgba(255, 35, 64, 0.16) 1px, transparent 1px),
          linear-gradient(rgba(255, 255, 255, 0.045) 1px, transparent 1px);
        background-size: 44px 44px;
        mask-image: radial-gradient(circle at 50% 50%, #000 0%, transparent 78%);
        opacity: 0.8;
      }

      body::after {
        background:
          linear-gradient(90deg, transparent 0 8%, rgba(255, 35, 64, 0.52) 8% 8.2%, transparent 8.2% 91.8%, rgba(255, 35, 64, 0.52) 91.8% 92%, transparent 92%),
          linear-gradient(180deg, transparent 0 7%, rgba(255, 35, 64, 0.55) 7% 7.2%, transparent 7.2% 92.8%, rgba(255, 35, 64, 0.55) 92.8% 93%, transparent 93%),
          radial-gradient(circle at 22% 30%, rgba(255, 35, 64, 0.28), transparent 17%),
          radial-gradient(circle at 79% 68%, rgba(255, 35, 64, 0.2), transparent 18%);
        filter: drop-shadow(0 0 16px rgba(255, 35, 64, 0.32));
      }

      main {
        align-items: center;
        aspect-ratio: 16 / 9;
        background:
          linear-gradient(90deg, rgba(255, 35, 64, 0.28), transparent 17% 83%, rgba(255, 35, 64, 0.28)),
          radial-gradient(circle at 18% 42%, rgba(255, 35, 64, 0.26), transparent 17%),
          radial-gradient(circle at 80% 48%, rgba(255, 255, 255, 0.07), transparent 18%),
          linear-gradient(145deg, rgba(8, 14, 22, 0.94), rgba(9, 6, 10, 0.95));
        border: 1px solid rgba(255, 78, 98, 0.5);
        box-shadow:
          0 0 0 1px rgba(255, 255, 255, 0.08) inset,
          0 0 38px rgba(255, 35, 64, 0.36),
          0 28px 110px rgba(0, 0, 0, 0.72);
        display: grid;
        isolation: isolate;
        justify-self: center;
        max-height: min(76vh, 820px);
        max-width: 1280px;
        overflow: hidden;
        padding: clamp(28px, 6vw, 84px);
        position: relative;
        width: min(100%, 1280px);
      }

      main::before,
      main::after {
        content: "";
        pointer-events: none;
        position: absolute;
        z-index: -1;
      }

      main::before {
        background:
          repeating-linear-gradient(
            90deg,
            rgba(255, 35, 64, 0.3) 0 2px,
            transparent 2px 24px
          ),
          repeating-linear-gradient(
            180deg,
            rgba(255, 255, 255, 0.05) 0 1px,
            transparent 1px 18px
          );
        inset: 0;
        opacity: 0.22;
      }

      main::after {
        border: 1px solid rgba(255, 78, 98, 0.72);
        box-shadow:
          0 0 0 10px rgba(209, 18, 42, 0.06),
          0 0 28px rgba(255, 35, 64, 0.38) inset;
        inset: clamp(10px, 1.8vw, 24px);
      }

      .corner {
        border-color: var(--red-hot);
        border-style: solid;
        height: clamp(46px, 8vw, 96px);
        opacity: 0.94;
        position: absolute;
        width: clamp(46px, 8vw, 96px);
      }

      .corner:nth-child(1) {
        border-width: 2px 0 0 2px;
        left: 18px;
        top: 18px;
      }

      .corner:nth-child(2) {
        border-width: 2px 2px 0 0;
        right: 18px;
        top: 18px;
      }

      .corner:nth-child(3) {
        border-width: 0 0 2px 2px;
        bottom: 18px;
        left: 18px;
      }

      .corner:nth-child(4) {
        border-width: 0 2px 2px 0;
        bottom: 18px;
        right: 18px;
      }

      .orb {
        aspect-ratio: 1;
        border: 1px solid rgba(255, 51, 76, 0.5);
        border-radius: 50%;
        box-shadow:
          0 0 36px rgba(255, 35, 64, 0.28),
          0 0 0 22px rgba(255, 35, 64, 0.035);
        left: clamp(30px, 8vw, 110px);
        opacity: 0.7;
        position: absolute;
        top: 50%;
        transform: translateY(-50%);
        width: clamp(130px, 22vw, 280px);
      }

      .orb::before,
      .orb::after {
        border: 1px solid rgba(255, 51, 76, 0.38);
        border-radius: inherit;
        content: "";
        inset: 18%;
        position: absolute;
      }

      .orb::after {
        inset: 36%;
      }

      .trace {
        align-items: center;
        display: grid;
        gap: clamp(16px, 2.4vw, 28px);
        justify-self: center;
        max-width: 880px;
        text-align: center;
      }

      .trace p {
        color: var(--white);
        font-family: Georgia, "Times New Roman", serif;
        font-size: clamp(1.58rem, 4.1vw, 4.05rem);
        font-weight: 800;
        letter-spacing: 0.01em;
        line-height: 1.16;
        margin: 0;
        text-shadow:
          0 2px 0 rgba(255, 255, 255, 0.1),
          0 0 24px rgba(255, 35, 64, 0.34),
          0 16px 48px rgba(0, 0, 0, 0.72);
      }

      .trace p + p {
        color: var(--muted);
        font-family:
          Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont,
          "Segoe UI", sans-serif;
        font-size: clamp(1rem, 2vw, 1.58rem);
        font-weight: 800;
        letter-spacing: 0.02em;
      }

      @media (max-width: 720px) {
        body {
          align-items: start;
          padding: 14px;
        }

        main {
          aspect-ratio: auto;
          min-height: calc(100vh - 28px);
          padding: 32px 22px;
        }

        .orb {
          left: 50%;
          top: 26%;
          transform: translate(-50%, -50%);
          width: 210px;
        }

        .trace {
          align-self: center;
          text-align: left;
        }
      }

      @media (prefers-reduced-motion: no-preference) {
        main {
          animation: panelEnter 820ms ease both;
        }

        .orb {
          animation: slowPulse 3.4s ease-in-out infinite;
        }
      }

      @keyframes panelEnter {
        from {
          opacity: 0;
          transform: translateY(10px) scale(0.985);
        }

        to {
          opacity: 1;
          transform: translateY(0) scale(1);
        }
      }

      @keyframes slowPulse {
        0%,
        100% {
          opacity: 0.56;
        }

        50% {
          opacity: 0.88;
        }
      }
    </style>
    <!-- Kırmızı ip doğru dosyayı işaret eder. -->
  </head>
  <body>
    <main aria-label="Görünmeyen Yüz">
      <span class="corner" aria-hidden="true"></span>
      <span class="corner" aria-hidden="true"></span>
      <span class="corner" aria-hidden="true"></span>
      <span class="corner" aria-hidden="true"></span>
      <span class="orb" aria-hidden="true"></span>

      <section class="trace">
        <p>İlk iz seni bu yüze getirdi; fakat yüzey tek başına konuşmaz.</p>
        <p>Dedektif, ekranda duran metni değil, metni taşıyan satırları da dinler.</p>
      </section>
    </main>
  </body>
</html>
